[project]
name = "blt"
version = "0.1.0"
description = "BLT"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "altair>=5.5.0",
    "datatrove>=0.5.0",
    "fsspec>=2024.6.1",
    "huggingface-hub[hf-xet]==0.30.*",
    "jinja2>=3.1.6",
    "lm-eval>=0.4.8",
    "luigi>=3.6.0",
    "numpy>=2.1.2",
    "omegaconf>=2.3.0",
    "orjson>=3.10.18",
    "pydantic>=2.11.4",
    "pynvml>=12.0.0",
    "rich>=14.0.0",
    "s3fs>=2024.6.1",
    "scipy>=1.15.2",
    "sentencepiece>=0.2.0",
    "submitit>=1.5.2",
    "tiktoken>=0.8.0",
    "typer>=0.15.3",
    "viztracer>=1.0.3",
    "wandb>=0.19.10",
    "xformers",
]

[project.optional-dependencies]
rocm = [
    "torch==2.7.1; sys_platform == 'linux'",
    "torchvision==0.22.1; sys_platform == 'linux'",
    "torchaudio==2.7.1; sys_platform == 'linux'",
    "pytorch-triton-rocm; sys_platform == 'linux'",
    "xformers; sys_platform == 'linux'",
]

[[tool.uv.index]]
name = "torch-nightly-cu121"
url = "https://download.pytorch.org/whl/nightly/cu121"

[[tool.uv.index]]
name = "torch-rocm63"
url = "https://download.pytorch.org/whl/rocm6.3"
explicit = true


[tool.uv.sources]
torch = [
    { index = "torch-rocm63", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "torch-rocm63", extra = "rocm", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "torch-rocm63", extra = "rocm", marker = "sys_platform == 'linux'" },
]
pytorch-triton-rocm = [
    { index = "torch-rocm63", extra = "rocm", marker = "sys_platform == 'linux'" },
]
xformers = [
    { index = "torch-rocm63", extra = "rocm", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
pre_build = [
    "setuptools",
    "ninja",
    "torch==2.6.0.dev20241112; extra != 'rocm'",
]
pre_build_rocm = [
    "setuptools",
    "ninja",
    "torch==2.7.1; sys_platform == 'linux'",
    "torchvision==0.22.1; sys_platform == 'linux'",
    "torchaudio==2.7.1; sys_platform == 'linux'",
    "pytorch-triton-rocm; sys_platform == 'linux'",
]
compile_xformers = ['xformers']
dev = [
    "black==24.8.0",
    "ipython>=9.2.0",
    "isort>=6.0.1",
    "pudb>=2025.1",
]


[tool.uv]
no-build-isolation-package = ["xformers"]
index-strategy = "unsafe-best-match"

[tool.isort]
profile = "black"
known_bytelatent = "bytelatent"
known_apps = "apps"
known_third_party = "wandb"
sections = "FUTURE,STDLIB,THIRDPARTY,BYTELATENT,APPS,FIRSTPARTY,LOCALFOLDER"
